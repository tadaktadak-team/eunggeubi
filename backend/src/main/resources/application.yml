spring:
  application:
    name: eunggeubi
  profiles:
    active: local

jwt:
  access-token-validity-ms: 3600000       # access 토큰 1시간
  refresh-token-validity-ms: 1209600000   # refresh 토큰 14일


---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:eunggeubi
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: prod


  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/eunggeubi}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:eunggeubi}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}