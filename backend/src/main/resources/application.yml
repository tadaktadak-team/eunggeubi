spring:
  application:
    name: eunggeubi
  profiles:
    active: local
  # KDCA/OpenAI 등 외부 API 호출이 응답 없이 무한정 멈추는 걸 막기 위한 전역 타임아웃.
  # (Boot가 자동구성한 RestClient.Builder를 쓰는 클라이언트엔 전부 적용됨)
  http:
    client:
      connect-timeout: 15s
      read-timeout: 30s
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: health_info
        initialize-schema: true

jwt:
  access-token-validity-ms: 3600000       # access 토큰 1시간
  refresh-token-validity-ms: 1209600000   # refresh 토큰 14일

kdca:
  health-info:
    base-url: https://api.kdca.go.kr/api/provide/healthInfo
    token: ${KDCA_TOKEN}

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/eunggeubi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: prod

  # 운영 환경에서는 환경변수로 주입한다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/eunggeubi}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:eunggeubi}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
