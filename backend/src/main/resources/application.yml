spring:
  application:
    name: eunggeubi
  profiles:
    active: local

jwt:
  access-token-validity-ms: 3600000       # access 토큰 1시간
  refresh-token-validity-ms: 1209600000   # refresh 토큰 14일

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/eunggeubi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: prod

  # 운영 환경에서는 환경변수로 주입한다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/eunggeubi}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:eunggeubi}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}

medical_locator:
  secret: ${MEDICAL_LOCATOR_SECRET}
